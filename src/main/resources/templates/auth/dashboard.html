<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <h1>Dashboard</h1>
    <p>Bienvenido, <span sec:authentication="name"></span></p>

    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">
        Panel de Administración
    </a>

    <p sec:authorize="hasRole('USER')">
        Acceso de usuario estándar.
    </p>

    <a th:href="@{/estudiantes}">Ver Estudiantes</a>
    <a th:href="@{/cursos}">Ver Cursos</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Cerrar Sesión</button>
    </form>
</body>

</html>
